<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    
    <link rel="icon" type="image/png" href="https://mepdesignstudio.com/images/mep-logo.png">

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            max-width: 650px; 
            padding: 40px 20px;
        }
        .logo {
            max-width: 220px; 
            height: auto;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #000;
        }
        .auto-timestamp {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 45px;
            font-style: italic;
        }

        /* Primary Button Style */
        .viewer-button {
            display: inline-block;
            color: #0696d7;
            background-color: #f0f9ff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.4rem;
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid #d0e8f7;
            transition: all 0.2s ease;
        }
        .viewer-button:hover {
            background-color: #e0f2fe;
            color: #057fb5;
            transform: translateY(-2px);
        }

        /* Secondary Link Style */
        .aux-link {
            display: inline-block;
            color: #0696d7;
            font-weight: normal;
            text-decoration: none;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: color 0.2s ease;
        }
        .aux-link:hover {
            color: #057fb5;
            text-decoration: underline;
        }

        .archive-section {
            margin-top: 50px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        .archive-title {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .archive-item {
            margin-bottom: 10px;
        }
        .archive-link {
            color: #777;
            font-size: 0.95rem;
            text-decoration: none;
        }
        .archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://mepdesignstudio.com/images/mep-logo.png" alt="MEP Logo" class="logo">

        <h1>MEP.24.172 TOYO R&D</h1>

        <div class="auto-timestamp">
            Poslednje ažuriranje: <span id="auto-time"></span>
        </div>
        
        <div style="margin-bottom: 40px;">
            <p style="margin: 0;">
                <a href="https://autode.sk/4nYELy9" class="viewer-button">Otvori Autodesk Viewer</a>
            </p>
            <p style="margin: 15px 0 0 0;">
                <a href="https://drive.google.com/file/d/1TX9uRhiwgIM8bVAUMXwsdR4FaHLtiC0J/view?usp=sharing" class="aux-link">Preuzmi model u NWD formatu</a>
            </p>
        </div>

        <div class="archive-section">
            <h3 class="archive-title">Prethodna verzija</h3>
            <ul>
                <li class="archive-item">
                    <a href="https://autode.sk/4nYzbvS" class="archive-link">Model od 26.05.2026</a>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const lastMod = new Date(document.lastModified);
        const options = { 
            day: '2-digit', 
            month: '2-digit', 
            year: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit' 
        };
        document.getElementById('auto-time').innerHTML = lastMod.toLocaleDateString('sr-RS', options);
    </script>

</body>
</html>
