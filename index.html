<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    
    <link rel="icon" type="image/png" href="https://mepdesignstudio.com/images/mep-logo.png">

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container { max-width: 700px; padding: 40px 20px; }

        /* Partner Logo Line */
        .partner-line { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 40px; 
            flex-wrap: wrap; 
        }
        .partner-logo { 
            height: 28px; 
            width: auto; 
            display: block;
            object-fit: contain;
        }
        img[alt="Toyo"] { height: 18px; }
        .logo-divider { width: 1px; height: 20px; background-color: #eee; }

        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #000; }
        
        .info-group {
            margin-bottom: 20px;
        }

        .auto-timestamp { 
            font-size: 0.95rem; 
            color: #666; 
            font-style: italic;
            display: block;
        }

        /* Notification Button */
        #notify-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            font-style: italic;
            padding: 5px 10px;
            margin-top: 5px;
            transition: color 0.2s;
        }
        #notify-btn:hover { color: #0696d7; }

        /* Separator Lines */
        .separator {
            width: 100%;
            height: 1px;
            background-color: #eee;
            margin: 20px 0 40px 0;
        }

        /* Main Buttons */
        .viewer-button {
            display: inline-block;
            color: #0696d7;
            background-color: #f0f9ff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.3rem;
            padding: 14px 30px;
            border-radius: 8px;
            border: 1px solid #d0e8f7;
            transition: all 0.2s ease;
        }
        .viewer-button:hover { 
            background-color: #e0f2fe; 
            transform: translateY(-2px); 
        }
