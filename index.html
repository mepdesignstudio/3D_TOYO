<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    <link rel="icon" type="image/png" href="https://mepdesignstudio.com/images/mep-logo.png">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container { max-width: 700px; padding: 40px 20px; }
        .partner-line { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .partner-logo { height: 28px; width: auto; display: block; object-fit: contain; }
        img[alt="Toyo"] { height: 18px; }
        .logo-divider { width: 1px; height: 20px; background-color: #eee; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #000; }
        .info-group { margin-bottom: 20px; }
        .auto-timestamp { font-size: 0.95rem; color: #666; font-style: italic; display: block; }
        #notify-btn { background: none; border: none; color: #666; font-size: 0.85rem; cursor: pointer; text-decoration: underline; font-style: italic; padding: 5px 10px; margin-top: 5px; }
        #notify-btn:hover { color: #0696d7; }
        .separator { width: 100%; height: 1px; background-color: #eee; margin: 20px 0 0 0; }
        .cta-container { padding: 30px 0; }
        .viewer-button {
            display: inline-block;
            color: #0696d7;
            background-color: #f0f9ff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 11px 24px;
            border-radius: 8px;
            border: 1px solid #d0e8f7;
            transition: all 0.2s ease;
            width: 230px;
        }
        .viewer-button:hover { background-color: #e0f2fe; transform: translateY(-2px); }
        .archive-separator { width: 100%; height: 1px; background-color: #eee; margin: 0 0 25px 0; }
        .archive-title { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .archive-link { color: #777; font-size: 0.9rem; text-decoration: none; }
        .archive-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="partner-line">
            <img src="https://mepdesignstudio.com/images/mep-logo.png" alt="MEP" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Toyo_Tire_logo.svg/1280px-Toyo_Tire_logo.svg.png" alt="Toyo" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="Enegogroup-DP.png" alt="Energogroup" class="partner-logo">
        </div>

        <h1>MEP.24.172 TOYO R&D</h1>
        <div class="info-group">
            <span class="auto-timestamp">Poslednje ažuriranje <span id="auto-time">Učitavanje...</span></span>
            <button id="notify-btn">Uključi obaveštenja o ažuriranju</button>
        </div>
        <div class="separator"></div>
        
        <div class="cta-container">
            <p style="margin: 0;">
                <a href="#" id="sheet-viewer-link" class="viewer-button">Učitavanje...</a>
            </p>
            <p style="margin: 15px 0 0 0;">
                <a href="#" id="sheet-nwd-link" class="viewer-button">Preuzmi .NWD</a>
            </p>
            <p style="margin: 15px 0 0 0;">
                <a href="#" id="sheet-clash-link" class="viewer-button" download>Clash Report</a>
            </p>
        </div>
        
        <div class="archive-separator"></div>
        <div class="archive-section">
            <h3 class="archive-title">Prethodna verzija</h3>
            <ul>
                <li><a href="#" id="sheet-prev-link" class="archive-link">Učitavanje...</a></li>
            </ul>
        </div>
    </div>

    <script>
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQAgpgwqpGgd7oQ1Oo-pzEyk_TtP6_W3efClH3fQQgU2OMH7Ci8dA0Uy8xb01z-SdAlMP7nTp9dRLT6/pub?output=csv';
        let currentDataState = null;

        function fetchSheetData() {
            const cacheBuster = sheetURL + "&t=" + new Date().getTime();
            fetch(cacheBuster)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                const rowData = rows[1];
                const delimiter = rowData.includes(';') ? ';' : ',';
                const cells = rowData.split(delimiter); 
                
                if (currentDataState !== null && currentDataState !== rowData) {
                    if (Notification.permission === "granted") {
                        new Notification("Projekat ažuriran", {
                            body: "Podaci u tabeli su promenjeni. Učitavanje nove verzije...",
                            icon: "https://mepdesignstudio.com/images/mep-logo.png",
                            requireInteraction: true
                        });
                    }
                    currentDataState = rowData;
                    setTimeout(() => { window.location.reload(); }, 2000);
                    return;
                }

                if (currentDataState === null) currentDataState = rowData;

                const latestLink = cells[0]?.trim();
                const nwdLink    = cells[1]?.trim();
                const prevLink   = cells[2]?.trim();
                const prevDate   = cells[3]?.trim();
                const sheetDate  = cells[4]?.trim();
                let clashLink    = cells[5]?.trim(); // Kolona F

                if(latestLink) {
                    const btn = document.getElementById('sheet-viewer-link');
                    btn.href = latestLink;
                    btn.innerHTML = "Autodesk Viewer";
                }
                if(nwdLink) document.getElementById('sheet-nwd-link').href = nwdLink;
                if(prevLink && prevDate) {
                    const arc = document.getElementById('sheet-prev-link');
                    arc.href = prevLink;
                    arc.innerHTML = `Model od ${prevDate}`;
                }
                if(sheetDate) document.getElementById('auto-time').innerHTML = sheetDate;
                
                if(clashLink) {
                    // Pametna konverzija: Ako uneseš običan GDrive link za gledanje, 
                    // skripta ga automatski pretvara u link za direktno preuzimanje (Direct Download)
                    if (clashLink.includes("drive.google.com") && clashLink.includes("/file/d/")) {
                        const fileId = clashLink.split("/file/d/")[1].split("/")[0];
                        clashLink = `https://docs.google.com/uc?export=download&id=${fileId}`;
                    }
                    document.getElementById('sheet-clash-link').href = clashLink;
                }
            })
            .catch(err => console.error("Sheet Error:", err));
        }

        fetchSheetData();
        setInterval(fetchSheetData, 30000);

        const notifyBtn = document.getElementById('notify-btn');
        if (Notification.permission === "granted") notifyBtn.style.display = 'none';

        notifyBtn.addEventListener('click', () => {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Sistem aktiviran", {
                        body: "Dobićete obaveštenje o promenama u realnom vremenu.",
                        icon: "https://mepdesignstudio.com/images/mep-logo.png"
                    });
                    notifyBtn.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
