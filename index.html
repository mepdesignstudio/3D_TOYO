<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    <link rel="icon" type="image/png" href="https://mepdesignstudio.com/images/mep-logo.png">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container { max-width: 700px; padding: 40px 20px; }
        .partner-line { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .partner-logo { height: 32px; width: auto; }
        .logo-divider { width: 1px; height: 20px; background-color: #eee; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #000; }
        .auto-timestamp { font-size: 0.95rem; color: #666; margin-bottom: 45px; font-style: italic; }
        
        .viewer-button {
            display: inline-block;
            color: #0696d7;
            background-color: #f0f9ff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.3rem;
            padding: 14px 30px;
            border-radius: 8px;
            border: 1px solid #d0e8f7;
            transition: all 0.2s ease;
        }
        .viewer-button:hover { background-color: #e0f2fe; transform: translateY(-2px); }
        
        .aux-link { display: inline-block; color: #0696d7; text-decoration: none; font-size: 1.05rem; margin-top: 15px; }
        .aux-link:hover { text-decoration: underline; }

        .archive-section { margin-top: 50px; border-top: 1px solid #eee; padding-top: 25px; }
        .archive-title { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .archive-link { color: #777; font-size: 0.9rem; text-decoration: none; }
        .archive-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="partner-line">
            <img src="https://mepdesignstudio.com/images/mep-logo.png" alt="MEP" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Toyo_Tire_logo.svg/1280px-Toyo_Tire_logo.svg.png" alt="Toyo" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="Enegogroup-DP.png" alt="Energogroup" class="partner-logo">
        </div>

        <h1>MEP.24.172 TOYO R&D</h1>

        <div class="auto-timestamp">
            Poslednje ažuriranje: <span id="auto-time"></span>
        </div>
        
        <div style="margin-bottom: 40px;">
            <p style="margin: 0;">
                <a href="#" id="sheet-viewer-link" class="viewer-button">Učitavanje...</a>
            </p>
            <p style="margin: 10px 0 0 0;">
                <a href="#" id="sheet-nwd-link" class="aux-link">Preuzmi model u NWD formatu</a>
            </p>
        </div>

        <div class="archive-section">
            <h3 class="archive-title">Prethodna verzija</h3>
            <ul>
                <li><a href="#" id="sheet-prev-link" class="archive-link">Učitavanje...</a></li>
            </ul>
        </div>
    </div>

    <script>
        // PASTE YOUR PUBLISHED CSV LINK HERE
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQAgpgwqpGgd7oQ1Oo-pzEyk_TtP6_W3efClH3fQQgU2OMH7Ci8dA0Uy8xb01z-SdAlMP7nTp9dRLT6/pub?output=csv';

        function fetchSheetData() {
            fetch(sheetURL)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                const cells = rows[1].split(','); // Row 2
                
                const latestLink = cells[0].trim();
                const nwdLink    = cells[1].trim();
                const prevLink   = cells[2].trim();
                const prevDate   = cells[3].trim();

                // Update Main Link
                if(latestLink) {
                    const btn = document.getElementById('sheet-viewer-link');
                    btn.href = latestLink;
                    btn.innerHTML = "Otvori Autodesk Viewer";
                }
                
                // Update NWD Link
                if(nwdLink) {
                    document.getElementById('sheet-nwd-link').href = nwdLink;
                }

                // Update Archive Link
                if(prevLink && prevDate) {
                    const arc = document.getElementById('sheet-prev-link');
                    arc.href = prevLink;
                    arc.innerHTML = `Model od ${prevDate}`;
                }
            })
            .catch(err => console.error("Error loading Sheet:", err));
        }

        fetchSheetData();

        const lastMod = new Date(document.lastModified);
        document.getElementById('auto-time').innerHTML = lastMod.toLocaleDateString('sr-RS', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
    </script>
</body>
</html>
