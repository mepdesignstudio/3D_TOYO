<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Changed to min-height for better scrolling on mobile */
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            max-width: 650px; 
            padding: 40px 20px;
        }
        .logo {
            max-width: 220px; 
            height: auto;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #000;
        }
        /* Update Notes Styling */
        .updates-box {
            display: inline-block;
            text-align: left;
            margin-bottom: 35px;
            font-size: 1rem;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #0696d7;
        }
        .update-row {
            display: flex;
            align-items: flex-start;
        }
        .date-label {
            font-weight: bold;
            white-space: nowrap;
            margin-right: 15px;
            color: #000;
        }
        .notes-list {
            color: #444;
            line-height: 1.6;
        }
        /* Primary Link Styling */
        .viewer-link {
            display: inline-block;
            color: #0696d7;
            font-weight: bold;
            text-decoration: underline;
            font-size: 1.4rem;
            margin-bottom: 40px;
        }
        .viewer-link:hover {
            color: #057fb5;
        }
        /* Archive Styling */
        .archive-section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        .archive-title {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .archive-item {
            margin-bottom: 10px;
        }
        .archive-link {
            color: #777;
            font-size: 0.95rem;
            text-decoration: none;
        }
        .archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://mepdesignstudio.com/images/mep-logo.png" alt="MEP Logo" class="logo">

        <h1>MEP.24.172 TOYO R&D</h1>
        
        <div class="updates-box">
            <div class="update-row">
                <span class="date-label">22.05.2026 </span>
                <span class="notes-list">
                    • Ubačene su unutrašnje jedinice VRF sistema<br>
                    • Izmene razvoda AHU2<br>
                    • Linijski difuzori ukinuti (zamenjeni na TROX DLQ)<br>
                    • Ubačena kompletna sprinkler mreža (Vortex model - Jovana L.)
                </span>
            </div>
        </div>
        
        <div>
            <a href="https://autode.sk/43xYICp" class="viewer-link">Otvori Autodesk Viewer</a>
        </div>

        <div class="archive-section">
            <h3 class="archive-title">Prethodna verzija</h3>
            <ul>
                <li class="archive-item">
                    <a href="https://autode.sk/3Pxlqre" class="archive-link">Model od 22.05.2026</a>
            </ul>
        </div>
    </div>

</body>
</html>
