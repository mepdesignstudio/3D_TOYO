<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    
    <link rel="icon" type="image/png" href="https://mepdesignstudio.com/images/mep-logo.png">

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container { max-width: 700px; padding: 40px 20px; }

        /* Partner Logo Line */
        .partner-line { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 40px; 
            flex-wrap: wrap; 
        }
        .partner-logo { 
            height: 28px; 
            width: auto; 
            display: block;
            object-fit: contain;
        }
        img[alt="Toyo"] { height: 18px; }
        .logo-divider { width: 1px; height: 20px; background-color: #eee; }

        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #000; }
        
        .info-group {
            margin-bottom: 20px;
        }

        .auto-timestamp { 
            font-size: 0.95rem; 
            color: #666; 
            font-style: italic;
            display: block;
        }

        /* Notification Button */
        #notify-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            font-style: italic;
            padding: 5px 10px;
            margin-top: 5px;
            transition: color 0.2s;
        }
        #notify-btn:hover { color: #0696d7; }

        /* Separator Lines */
        .separator {
            width: 100%;
            height: 1px;
            background-color: #eee;
            margin: 20px 0 0 0;
        }

        /* Main CTA Buttons Container */
        .cta-container {
            padding: 30px 0; /* Reduced padding for tighter scale */
        }

        .viewer-button {
            display: inline-block;
            color: #0696d7;
            background-color: #f0f9ff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1rem; /* Scaled from 1.3rem (~0.85x) */
            padding: 11px 24px; /* Scaled padding */
            border-radius: 8px;
            border: 1px solid #d0e8f7;
            transition: all 0.2s ease;
            width: 230px; /* Scaled from 280px (~0.8x) */
        }
        .viewer-button:hover { 
            background-color: #e0f2fe; 
            transform: translateY(-2px); 
        }

        /* Archive Section */
        .archive-separator {
            width: 100%;
            height: 1px;
            background-color: #eee;
            margin: 0 0 25px 0;
        }
        .archive-section { margin-top: 0; }
        .archive-title { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .archive-link { color: #777; font-size: 0.9rem; text-decoration: none; }
        .archive-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="partner-line">
            <img src="https://mepdesignstudio.com/images/mep-logo.png" alt="MEP" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Toyo_Tire_logo.svg/1280px-Toyo_Tire_logo.svg.png" alt="Toyo" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="Enegogroup-DP.png" alt="Energogroup" class="partner-logo">
        </div>

        <h1>MEP.24.172 TOYO R&D</h1>

        <div class="info-group">
            <span class="auto-timestamp">Poslednje ažuriranje: <span id="auto-time"></span></span>
            <button id="notify-btn">Uključi obaveštenja o ažuriranju</button>
        </div>

        <div class="separator"></div>
        
        <div class="cta-container">
            <p style="margin: 0;">
                <a href="#" id="sheet-viewer-link" class="viewer-button">Učitavanje...</a>
            </p>
            <p style="margin: 15px 0 0 0;">
                <a href="#" id="sheet-nwd-link" class="viewer-button">Preuzmi .NWD</a>
            </p>
        </div>

        <div class="archive-separator"></div>
        <div class="archive-section">
            <h3 class="archive-title">Prethodna verzija</h3>
            <ul>
                <li><a href="#" id="sheet-prev-link" class="archive-link">Učitavanje...</a></li>
            </ul>
        </div>
    </div>

    <script>
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQAgpgwqpGgd7oQ1Oo-pzEyk_TtP6_W3efClH3fQQgU2OMH7Ci8dA0Uy8xb01z-SdAlMP7nTp9dRLT6/pub?output=csv';
        let currentViewerLink = "";

        function fetchSheetData() {
            fetch(sheetURL)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                const delimiter = rows[1].includes(';') ? ';' : ',';
                const cells = rows[1].split(delimiter); 
                
                const latestLink = cells[0]?.trim();
                const nwdLink    = cells[1]?.trim();
                const prevLink   = cells[2]?.trim();
                const prevDate   = cells[3]?.trim();

                if (currentViewerLink !== "" && currentViewerLink !== latestLink) {
                    if (Notification.permission === "granted") {
                        new Notification("Model je ažuriran!", {
                            body: "Nova verzija projekta je dostupna.",
                            icon: "https://mepdesignstudio.com/images/mep-logo.png"
                        });
                    }
                    window.location.reload(); 
                }
                currentViewerLink = latestLink;

                if(latestLink) {
                    const btn = document.getElementById('sheet-viewer-link');
                    btn.href = latestLink;
                    btn.innerHTML = "Otvori Autodesk Viewer";
                }
                if(nwdLink) {
                    const nwdBtn = document.getElementById('sheet-nwd-link');
                    nwdBtn.href = nwdLink;
                }
                if(prevLink && prevDate) {
                    const arc = document.getElementById('sheet-prev-link');
                    arc.href = prevLink;
                    arc.innerHTML = `Model od ${prevDate}`;
                }
            })
            .catch(err => console.error("Sheet Error:", err));
        }

        fetchSheetData();
        setInterval(fetchSheetData, 300000);

        const lastMod = new Date(document.lastModified);
        document.getElementById('auto-time').innerHTML = lastMod.toLocaleDateString('sr-RS', {
            day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
        });

        const notifyBtn = document.getElementById('notify-btn');
        if (Notification.permission === "granted") notifyBtn.style.display = 'none';

        notifyBtn.addEventListener('click', () => {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Obaveštenja aktivirana", {
                        body: "Dobićete poruku kada se linkovi ažuriraju.",
                        icon: "https://mepdesignstudio.com/images/mep-logo.png"
                    });
                    notifyBtn.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
