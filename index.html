<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYO 3D | MEP Portal</title>
    
    <link rel="icon" type="image/png" href="https://mepdesignstudio.com/images/mep-logo.png">

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            max-width: 700px; 
            padding: 40px 20px;
        }

        /* Partner Logo Line */
        .partner-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .partner-logo {
            height: 35px; /* Unified height for a clean look */
            width: auto;
            display: block;
        }
        .logo-divider {
            width: 1px;
            height: 25px;
            background-color: #eee;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #000;
        }
        .auto-timestamp {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 45px;
            font-style: italic;
        }

        /* Primary Button Style */
        .viewer-button {
            display: inline-block;
            color: #0696d7;
            background-color: #f0f9ff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.4rem;
            padding: 15px 35px;
            border-radius: 8px;
            border: 1px solid #d0e8f7;
            transition: all 0.2s ease;
        }
        .viewer-button:hover {
            background-color: #e0f2fe;
            color: #057fb5;
            transform: translateY(-2px);
        }

        /* Secondary Link Style */
        .aux-link {
            display: inline-block;
            color: #0696d7;
            font-weight: normal;
            text-decoration: none;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: color 0.2s ease;
        }
        .aux-link:hover {
            color: #057fb5;
            text-decoration: underline;
        }

        .archive-section {
            margin-top: 50px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        .archive-title {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .archive-item {
            margin-bottom: 10px;
        }
        .archive-link {
            color: #777;
            font-size: 0.95rem;
            text-decoration: none;
        }
        .archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

            <div class="logo-divider"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Toyo_Tire_logo.svg/1280px-Toyo_Tire_logo.svg.png" alt="Toyo Tires" class="partner-logo">
            <div class="logo-divider"></div>
            <img src="https://polocomm.com/wp-content/uploads/2023/03/Enegogroup-DP.png" alt="Energogroup" class="partner-logo">
        </div>

        <h1>MEP.24.172 TOYO R&D</h1>

        <div class="auto-timestamp">
            Poslednje ažuriranje: <span id="auto-time"></span>
        </div>
